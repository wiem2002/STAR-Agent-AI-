<aside class="sidebar" [class.sidebar--ouverte]="ouverte">
  <div class="sidebar__brand">
    <span class="sidebar__star">★</span>
    <div class="sidebar__brand-text">
      <strong>STAR</strong>
      <small>ASSURANCES TUNISIE</small>
    </div>
  </div>

  <nav class="sidebar__nav">
    <button
      *ngFor="let item of navItems"
      class="sidebar__item"
      [class.sidebar__item--actif]="itemActif === item.libelle"
      (click)="choisir(item)"
      type="button"
    >
      <span class="sidebar__icone">{{ item.icone }}</span>
      <span>{{ item.libelle }}</span>
    </button>
  </nav>

  <div class="sidebar__aide">
    <span class="sidebar__icone">❓</span>
    <div>
      <strong>Besoin d'aide ?</strong>
      <small>Support</small>
    </div>
  </div>
</aside>
<div class="sidebar__overlay" *ngIf="ouverte" (click)="fermer.emit()"></div>
